apiVersion: apps/v1
kind: Deployment
metadata:
  name: us-map-frontend
  labels:
    app: us-map-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: us-map-frontend
  template:
    metadata:
      labels:
        app: us-map-frontend
    spec:
      containers:
      - name: frontend
        image: us-map-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: us-map-frontend
  labels:
    app: us-map-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: us-map-frontend
