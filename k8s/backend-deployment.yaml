apiVersion: apps/v1
kind: Deployment
metadata:
  name: us-map-backend
  labels:
    app: us-map-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: us-map-backend
  template:
    metadata:
      labels:
        app: us-map-backend
    spec:
      containers:
      - name: backend
        image: us-map-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: GIN_MODE
          value: "release"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: us-map-backend
  labels:
    app: us-map-backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: us-map-backend
